<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HackHaven – Student Status</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f7f9;
      color: #333;
      margin: 0;
      padding: 1rem;
    }
    .status-container {
      max-width: 700px;
      margin: 2rem auto;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    header h1 {
      font-size: 2.5rem;
      color: #1e2a38;
      margin: 0;
    }
    header h2 {
      font-size: 1.5rem;
      color: #666;
      margin: 0;
    }
    #status-card-container {
      background-color: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    #loading-spinner {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      border: 5px solid rgba(0, 0, 0, 0.1);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border-left-color: #007bff;
      animation: spin 1s ease infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #error-message {
      padding: 1rem;
      border-radius: 8px;
      background-color: #f8d7da;
      color: #721c24;
      font-weight: bold;
      text-align: center;
    }
    #status-card section {
      margin-bottom: 2rem;
      border-bottom: 1px solid #eee;
      padding-bottom: 1.5rem;
    }
    #status-card section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    h3, h4 {
      color: #1e2a38;
      margin-top: 0;
      margin-bottom: 1rem;
    }
    p {
      line-height: 1.6;
      margin: 0.5rem 0;
    }
    #status-label {
      padding: 0.3rem 0.8rem;
      border-radius: 15px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      text-transform: capitalize;
    }
    .status-pending { background-color: #ff9800; }
    .status-approved { background-color: #4caf50; }
    .status-rejected { background-color: #f44336; }
    .stripe-link-container {
      display: flex;
      gap: 0.5rem;
    }
    #stripe-url {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #f4f4f4;
      flex-grow: 1;
    }
    #copy-btn {
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    #copy-btn:hover {
      background-color: #0056b3;
    }
    #copy-feedback {
      display: block;
      margin-top: 0.5rem;
      color: #007bff;
      font-weight: bold;
      height: 1em;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>

  <div class="status-container">
    <header>
      <h1>HackHaven</h1>
      <h2>Student Status</h2>
    </header>

    <main id="status-card-container">
      <div id="loading-spinner">
        <div class="spinner"></div>
        <p>Loading your status...</p>
      </div>
      <div id="error-message" style="display: none;"></div>
      <div id="status-card" style="display: none;">
        <section class="student-info">
          <h3>Verification Details</h3>
          <p><strong>Email:</strong> <span id="student-email"></span></p>
          <p><strong>Submitted At:</strong> <span id="submitted-at"></span></p>
          <p id="approval-timestamp" style="display: none;">
            <strong>Approved At:</strong> <span id="approved-at"></span>
          </p>
        </section>
        <section class="status-details">
          <h3>Your Status: <span id="status-label"></span></h3>
          <p id="status-message"></p>
        </section>
        <section id="stripe-section" style="display: none;">
          <h4>Complete Your Subscription</h4>
          <div class="stripe-link-container">
            <input type="text" id="stripe-url" readonly aria-label="Stripe checkout URL">
            <button id="copy-btn" aria-label="Copy checkout link to clipboard">Copy</button>
          </div>
          <small id="copy-feedback"></small>
        </section>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // --- DOM Element References ---
      const loadingSpinner = document.getElementById('loading-spinner');
      const errorMessage = document.getElementById('error-message');
      const statusCard = document.getElementById('status-card');
      const studentEmailEl = document.getElementById('student-email');
      const submittedAtEl = document.getElementById('submitted-at');
      const approvalTimestampEl = document.getElementById('approval-timestamp');
      const approvedAtEl = document.getElementById('approved-at');
      const statusLabelEl = document.getElementById('status-label');
      const statusMessageEl = document.getElementById('status-message');
      const stripeSection = document.getElementById('stripe-section');
      const stripeUrlInput = document.getElementById('stripe-url');
      const copyBtn = document.getElementById('copy-btn');
      const copyFeedback = document.getElementById('copy-feedback');

      // --- Mock API Fetch ---
      async function fetchStudentStatus(email) {
        // In a real application, this would be:
        // const response = await fetch(`/student/status/${email}`);
        // For this example, we mock the fetch.

        console.log(`Mocking fetch for email: ${email}`);

        // Mock data based on the provided sample
        const mockData = {
          "email": "student@example.edu",
          "status": "approved", // Change this to "pending" or "rejected" to test different states
          "submitted_at": "2025-10-15T10:30:00Z",
          "approved_at": "2025-10-15T12:00:00Z",
          "stripe_url": "https://checkout.stripe.com/pay/cs_test_a1b2c3d4e5f6"
        };

        return new Promise(resolve => {
          setTimeout(() => resolve(mockData), 1000); // Simulate network delay
        });
      }

      // --- UI Update Logic ---
      function updateUI(data) {
        studentEmailEl.textContent = data.email;
        submittedAtEl.textContent = new Date(data.submitted_at).toLocaleString();

        statusLabelEl.textContent = data.status;
        statusLabelEl.className = `status-${data.status}`;

        switch (data.status) {
          case 'approved':
            statusMessageEl.textContent = "Your verification is approved! Complete your subscription below.";
            approvalTimestampEl.style.display = 'block';
            approvedAtEl.textContent = new Date(data.approved_at).toLocaleString();
            stripeUrlInput.value = data.stripe_url;
            stripeSection.style.display = 'block';
            break;
          case 'pending':
            statusMessageEl.textContent = "Your verification is being reviewed. Please check back later.";
            break;
          case 'rejected':
            statusMessageEl.textContent = "Your verification was rejected. Please re-submit or contact support.";
            break;
        }
      }

      // --- Main Execution on Page Load ---
      async function main() {
        const params = new URLSearchParams(window.location.search);
        const email = params.get('email');

        if (!email) {
          loadingSpinner.style.display = 'none';
          errorMessage.textContent = 'Error: No student email provided in the URL.';
          errorMessage.style.display = 'block';
          return;
        }

        try {
          const data = await fetchStudentStatus(email);
          updateUI(data);
          loadingSpinner.style.display = 'none';
          statusCard.style.display = 'block';
        } catch (error) {
          loadingSpinner.style.display = 'none';
          errorMessage.textContent = 'Failed to load your status. Please try again later.';
          errorMessage.style.display = 'block';
        }
      }

      // --- Event Listeners ---
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(stripeUrlInput.value).then(() => {
          copyFeedback.textContent = 'Copied!';
          setTimeout(() => copyFeedback.textContent = '', 2000);
        }).catch(err => {
          copyFeedback.textContent = 'Failed to copy.';
        });
      });

      main();
    });
  </script>

</body>
</html>
