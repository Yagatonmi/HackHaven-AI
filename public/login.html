<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HackHaven</title>
  <style>
    body { font-family: sans-serif; background-color: #f4f7f9; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-container { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 300px; }
    h2 { text-align: center; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; }
    input { width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #ccc; }
    button { width: 100%; padding: 0.75rem; border-radius: 6px; border: none; background-color: #007bff; color: #fff; cursor: pointer; }
    #message { margin-top: 1rem; text-align: center; color: red; }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Admin & Student Login</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit">Login</button>
    </form>
    <div id="message"></div>
  </div>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const messageDiv = document.getElementById('message');

        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error);
            }

            localStorage.setItem('jwtToken', data.token);

            if (data.user.role === 'admin') {
                window.location.href = '/admin.html';
            } else {
                window.location.href = `/student_status.html?id=${data.user.id}`;
            }
        } catch (error) {
            messageDiv.textContent = error.message;
        }
    });
  </script>
</body>
</html>
